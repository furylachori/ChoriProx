[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --ignore=tests/deprecated
    -v
markers =
    e2e: End-to-end tests (require llama-server)
    unit: Unit tests (all mocked)
    integration: Integration tests (mocked LLM)
    integration_neo4j: Tests requiring a live Neo4j instance (skipped if unavailable)
    e2e_real: Real LLM E2E tests (make real HTTP calls, max 2 workers)
    clients: N-client abstraction layer tests
