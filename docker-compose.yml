# Neo4j Docker setup for ChoriProx — PRODUCTION ONLY.
#
# This file contains ONLY the neo4j-prod service (the real production graph).
# Loaded from backups/neo4j_dumps/neo4j.dump on first start. Named volume
# neo4j-prod-data persists data across restarts. Bolt on 7687.
#
# The throwaway test container lives in docker-compose.test.yml. That file
# can be `docker compose -f docker-compose.test.yml down -v`'d safely — it
# CANNOT touch this prod volume, which only exists here.
#
# Why Enterprise: Community Edition allows only ONE database, so the test
# harness cannot isolate tests and its "Community fallback" wipes the shared
# DB (the data-loss bug). Enterprise supports CREATE DATABASE, giving each
# test an isolated DB. Accept the license env var below for dev use.
#
# Usage:
#   docker compose up -d                  # start prod
#   docker compose down                   # stop prod (data persists)
#
# NEVER run `docker compose down -v` against this file — it deletes the
# prod volume and all data is LOST. Use snapshots (scripts/neo4j-snapshot.sh)
# for backups.
#
# The proxy connects to prod at bolt://localhost:7687 with
# NEO4J_AUTH=neo4j:your-neo4j-password.
#
# Initial data load: see scripts/neo4j-load-dump.sh (loads backups/neo4j_dumps/
# neo4j.dump into the neo4j-prod volume).
#
# After starting or recreating the prod container, apply RBAC protection:
#   bash scripts/neo4j-apply-rbac.sh
# This prevents DETACH DELETE on :Task — the strongest defence against an
# agent wiping tasks via cypher-shell.

services:
  neo4j-prod:
    image: neo4j:2026.05.0-enterprise
    container_name: choriprox-neo4j-prod
    environment:
      # Enterprise Edition requires license acceptance for dev/non-prod use.
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: "neo4j/your-neo4j-password"
      NEO4J_server_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_server_http_listen__address: "0.0.0.0:7474"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j-prod-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks:
      - choriprox-prod

volumes:
  neo4j-prod-data:

networks:
  choriprox-prod:
    driver: bridge